# Gera o APK do app na nuvem do GitHub, sem precisar do Android Studio.
# Como usar: aba "Actions" do repositório › "Gerar APK" › "Run workflow" › cole o endereço do servidor › "Run workflow".
# Depois de uns 5 a 10 minutos, abra a execução e baixe "Fontenele-APK" (um .zip com o app-debug.apk dentro).
name: Gerar APK

on:
  workflow_dispatch:
    inputs:
      url_servidor:
        description: "Endereço do servidor (ex.: https://fontenele-servidor.onrender.com/)"
        required: true
        default: "https://fontenele-servidor.onrender.com/"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Gerar o APK
        env:
          URL_SERVIDOR: ${{ inputs.url_servidor }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -PurlServidor="$URL_SERVIDOR"

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Fontenele-APK
          path: app/build/outputs/apk/debug/app-debug.apk
